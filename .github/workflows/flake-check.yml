name: Flake Check

on:
  push:

jobs:
  check:
    runs-on:
      - sprinters:aws:ubuntu-latest:spot=auto
      - ${{ github.run_id }}-${{ github.run_attempt }}-flake-check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          diagnostic-endpoint: ""
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{runner.os}}-${{hashFiles('./flake.nix', './flake-modules/**/*.nix', './flake.lock')}}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H

      - name: build shell
        run: nix develop --accept-flake-config --command true

      - name: load ssh key for agenix
        run: |
          eval "$(nix develop --command ssh-agent -s)"
          nix develop --command ssh-add - <<< '${{ secrets.SSH_KEY }}'
      - name: Run flake check
        run: nix flake check --accept-flake-config
