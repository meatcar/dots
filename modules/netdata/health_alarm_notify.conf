# Sourced by alarm-notify.sh after the stock config; overrides only.

# no local email; cloud email is a per-user toggle in the cloud UI
SEND_EMAIL="NO"

SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="audit-log"

custom_sender() {
  # printf %()T is bash-builtin strftime; no external date dependency
  local line
  printf -v line '%(%Y-%m-%dT%H:%M:%S%z)T\t%s\t%s\t%s->%s\t%s\t%s' \
    "${when}" "${host}" "${name}" "${old_status}" "${status}" "${chart}" "${value_string}"
  # persisted audit trail (see modules/impermanence/netdata.nix)
  printf '%s\n' "${line}" >>/var/log/netdata/alerts.log
  # push channel: netdata-notify (home-manager) follows this identifier
  printf '%s\n' "${line}" | systemd-cat -t netdata-alert
}
