# Stock ram.conf/swap.conf route these to `silent`, and alarm-notify.sh drops
# the silent role before it ever looks up a recipient, so `to:` has to change
# in health config -- health_alarm_notify.conf cannot reach them. The stock
# names are disabled in ../default.nix; renaming is what keeps that negation
# from disabling these replacements too.

# An OOM kill is instantaneous and self-clearing, so an up-delay would lose it
# exactly the way used_swap was lost below. Stock carries none; only `to:` was
# ever wrong here.
      alarm: 30min_oom_kill
         on: mem.oom_kill
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
     lookup: sum -30m unaligned
      units: kills
      every: 1m
       warn: $this > 0
      delay: down 10m
    summary: System OOM kills
       info: Number of out of memory kills in the last 30 minutes
         to: sysadmin

      alarm: low_ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $avail * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
      delay: down 15m multiplier 1.5 max 1h
    summary: System available memory
       info: Percentage of estimated amount of RAM available for userspace processes, without causing swapping
         to: sysadmin

# Stock has `delay: up 30s`. Swap saturation here resolves by the OOM killer
# reaping the offender, which took 20s -- inside the delay, so netdata replaced
# the pending CRITICAL with the CLEAR and never ran alarm-notify.sh at all.
# The whole event went unrecorded. No up-delay: the spike *is* the signal.
      alarm: high_used_swap
         on: mem.swap
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: (($used + $free) > 0) ? ($used * 100 / ($used + $free)) : 0
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (50) : (60))
       crit: $this > (($status == $CRITICAL) ? (70) : (80))
      delay: down 15m multiplier 1.5 max 1h
    summary: System swap memory utilization
       info: Swap memory utilization
         to: sysadmin
