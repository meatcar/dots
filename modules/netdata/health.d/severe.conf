# stock routes these to silent, and alarm-notify.sh drops that role before it
# looks up a recipient, so `to:` can only change here. renamed because the
# stock names are disabled by name in ../default.nix

# NOTE: never add an up-delay -- an OOM kill is instantaneous and self-clearing
      alarm: 30min_oom_kill
         on: mem.oom_kill
      class: Errors
       type: System
  component: Memory
host labels: _os=linux
     lookup: sum -30m unaligned
      units: kills
      every: 1m
       warn: $this > 0
      delay: down 10m
    summary: System OOM kills
       info: Number of out of memory kills in the last 30 minutes
         to: sysadmin

      alarm: low_ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $avail * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
      delay: down 15m multiplier 1.5 max 1h
    summary: System available memory
       info: Percentage of estimated amount of RAM available for userspace processes, without causing swapping
         to: sysadmin

# stock has `delay: up 30s`, but the OOM killer cleared 99% swap in 20s, so the
# CRITICAL was replaced by the CLEAR before it ever dispatched
      alarm: high_used_swap
         on: mem.swap
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: (($used + $free) > 0) ? ($used * 100 / ($used + $free)) : 0
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (50) : (60))
       crit: $this > (($status == $CRITICAL) ? (70) : (80))
      delay: down 15m multiplier 1.5 max 1h
    summary: System swap memory utilization
       info: Swap memory utilization
         to: sysadmin
