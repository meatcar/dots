# netdata 2.x ships no stock temperature alerts; a laptop overheats silently.
# 10-minute average forgives load spikes; sustained heat is the signal.
 template: 10min_sensor_temperature
       on: system.hw.sensor.temperature.input
    class: Utilization
     type: System
component: Sensors
   lookup: average -10m unaligned of input
    units: Celsius
    every: 1m
     warn: $this > 85
     crit: $this > 95
    delay: down 15m multiplier 1.5 max 1h
  summary: Sensor ${label:chip_id} ${label:feature} temperature
     info: Average temperature of ${label:chip_id} ${label:feature} over the last 10 minutes
       to: sysadmin
