# netdata 2.x ships no stock temperature alerts; a laptop overheats silently.
# 10-minute average forgives load spikes; sustained heat is the signal.
#
# nvme is split out below; simple patterns are first-match, so negations first
    template: 10min_sensor_temperature
          on: system.hw.sensor.temperature.input
       class: Utilization
        type: System
   component: Sensors
chart labels: label=!Composite !Sensor* *
      lookup: average -10m unaligned of input
       units: Celsius
       every: 1m
        warn: $this > 85
        crit: $this > 95
       delay: down 15m multiplier 1.5 max 1h
     summary: Sensor ${label:chip_id} ${label:feature} temperature
        info: Average temperature of ${label:chip_id} ${label:feature} over the last 10 minutes
          to: sysadmin

# 84/88 are this drive's wctemp/cctemp; check `nvme id-ctrl` if it's replaced.
# the "Sensor N" die sensors run ~20C hotter and their max reads the 0xFFFF
# not-configured sentinel, so no absolute number means anything there
    template: 10min_nvme_composite_temperature
          on: system.hw.sensor.temperature.input
       class: Utilization
        type: System
   component: Sensors
chart labels: label=Composite
      lookup: average -10m unaligned of input
       units: Celsius
       every: 1m
        warn: $this > 84
        crit: $this > 88
       delay: down 15m multiplier 1.5 max 1h
     summary: Sensor ${label:chip_id} ${label:feature} temperature
        info: Average temperature of ${label:chip_id} ${label:feature} over the last 10 minutes
          to: sysadmin
