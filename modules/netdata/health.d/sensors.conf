# netdata 2.x ships no stock temperature alerts; a laptop overheats silently.
# 10-minute average forgives load spikes; sustained heat is the signal.
#
# NVMe is split out below, so all three of its channels are excluded here.
# Simple patterns are first-match, so the negations precede the catch-all.
    template: 10min_sensor_temperature
          on: system.hw.sensor.temperature.input
       class: Utilization
        type: System
   component: Sensors
chart labels: label=!Composite !Sensor* *
      lookup: average -10m unaligned of input
       units: Celsius
       every: 1m
        warn: $this > 85
        crit: $this > 95
       delay: down 15m multiplier 1.5 max 1h
     summary: Sensor ${label:chip_id} ${label:feature} temperature
        info: Average temperature of ${label:chip_id} ${label:feature} over the last 10 minutes
          to: sysadmin

# Composite is the only NVMe channel with vendor thresholds: the kernel wires
# temp_crit for that channel alone, from the controller's CCTEMP. The "Sensor N"
# die sensors run ~20C hotter by design, and their max reads 0xFFFF (65261C) --
# the NVMe "threshold not configured" sentinel -- so no absolute number means
# anything there. They stay graphed and unalerted.
#
# 84/88 track watson's drive, which reports wctemp=357K cctemp=361K. Another
# drive will publish its own; check `nvme id-ctrl` before trusting these.
    template: 10min_nvme_composite_temperature
          on: system.hw.sensor.temperature.input
       class: Utilization
        type: System
   component: Sensors
chart labels: label=Composite
      lookup: average -10m unaligned of input
       units: Celsius
       every: 1m
        warn: $this > 84
        crit: $this > 88
       delay: down 15m multiplier 1.5 max 1h
     summary: Sensor ${label:chip_id} ${label:feature} temperature
        info: Average temperature of ${label:chip_id} ${label:feature} over the last 10 minutes
          to: sysadmin
