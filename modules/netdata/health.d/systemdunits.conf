# Shadows the stock file, where every template is disabled via unit_name=!*.
# Only service units are worth alerting on here; the rest stay off.
# the dbus-activated ones exit after ~30s, so the chart goes obsolete and
# returns on next activation -- timedated churned 99 times in a week
    template: systemd_service_unit_failed_state
          on: systemd.service_unit_state
       class: Errors
        type: Linux
   component: Systemd units
chart labels: unit_name=!systemd-timedated !systemd-localed !systemd-hostnamed !restic-backups-* !restic-persist-* *
        calc: $failed
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: systemd unit ${label:unit_name} state
        info: systemd service unit in the failed state
          to: sysadmin

    template: restic_service_unit_failed_state
          on: systemd.service_unit_state
       class: Errors
        type: Backup
   component: Restic
chart labels: unit_name=restic-backups-* restic-persist-*
        calc: $failed
       units: state
       every: 10s
        crit: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: Restic unit ${label:unit_name} failed
        info: scheduled backup, retention, or repository maintenance failed
          to: sysadmin
