# Shadows the stock file, where every template is disabled via unit_name=!*.
# Only service units are worth alerting on here; the rest stay off.
#
# The dbus-activated units are excluded because they exit after ~30s, so the
# chart goes obsolete and reappears on the next activation -- automatic-
# timezoned alone churned systemd-timedated 99 times in a week. NRestarts=0
# throughout: these are activations, never failures.
    template: systemd_service_unit_failed_state
          on: systemd.service_unit_state
       class: Errors
        type: Linux
   component: Systemd units
chart labels: unit_name=!systemd-timedated !systemd-localed !systemd-hostnamed *
        calc: $failed
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: down 5m multiplier 1.5 max 1h
     summary: systemd unit ${label:unit_name} state
        info: systemd service unit in the failed state
          to: sysadmin
