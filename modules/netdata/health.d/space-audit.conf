# Starts the Amp space audit (see home-manager/modules/netdata-notify).
# NVMe and btrfs both need slack: the SSD for garbage collection and wear
# leveling, btrfs for new chunk allocation. Stock disk_space_usage waits
# until 90%; this fires at 80% and clears below 75%.
    template: btrfs_space_audit
          on: disk.space
       class: Utilization
        type: System
   component: Disk
chart labels: filesystem=btrfs
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING) ? (75) : (80))
       delay: up 5m down 1h
     summary: btrfs ${label:mount_point} over 80% used
        info: Used space on the btrfs filesystem; triggers a space audit
          to: sysadmin
